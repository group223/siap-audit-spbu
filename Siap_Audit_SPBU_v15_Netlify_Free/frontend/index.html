html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}

.pill{font-size:11px;padding:3px 9px;border-radius:99px;background:#ffffff26;white-space:nowrap}
.pill.off::before{content:"● ";color:#ff8b82}.pill.on::before{content:"● ";color:#9be7b5}
.bar{height:5px;border-radius:9px;background:#ffffff33;margin-top:11px;overflow:hidden}.bar i{display:block;height:100%;background:#fff;border-radius:9px}

.sp{width:100%;text-align:left;display:block}
.sp b{font-size:14px}.sp .meta{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin-top:9px;font-size:13px;color:var(--mut)}.sp .meta span:nth-child(even){color:var(--ink);font-weight:600}
.st{display:inline-block;font-size:12px;font-weight:700}.st.s0{color:var(--bad)}.st.s1{color:var(--lime)}.st.s2{color:var(--ok)}

.fab{position:fixed;right:max(16px,calc((100vw - 520px)/2 + 16px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--blue);color:#fff;border-radius:99px;padding:13px 20px;font-weight:700;box-shadow:0 8px 22px #0a63c94d;z-index:6}

.ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;border:2px solid var(--line);color:var(--mut)}
.ic.ok{background:var(--ok);border-color:var(--ok);color:#fff}.ic.bad{background:none;border:0;color:var(--bad);font-size:18px}.ic.warn{background:none;border:0;color:var(--warn);font-size:18px}
.sub{font-size:12px;font-weight:700;color:var(--blue);margin:12px 14px 4px}
.it{width:100%;display:flex;gap:11px;align-items:flex-start;text-align:left;padding:11px 14px;border-top:1px solid var(--line)}
.it .tx{flex:1;font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.it .tx b{display:block;font-size:11px;color:var(--mut)}
.chip{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--sky);color:var(--mut);white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav div{max-width:520px;margin:0 auto;display:flex}.nav button{flex:1;padding:9px 4px 8px;font-size:11px;color:var(--mut);display:grid;gap:1px;justify-items:center}.nav button span{font-size:19px}.nav button.on{color:var(--blue);font-weight:700}
.crit{font-size:15.5px;line-height:1.5;margin:0}.crit-meta{font-size:12px;color:var(--mut);margin:0 0 10px}
.grades{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:6px 0}
.g{width:62px;height:62px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:17px;display:grid;place-items:center;align-content:center;line-height:1.1}
.g small{font-size:10px;font-weight:500;color:var(--mut)}
.g.on{background:var(--lime);border-color:var(--lime);color:#14222f}.g.on small{color:#14222f}.g.on.x{background:var(--mut);border-color:var(--mut);color:#fff}.g.on.low{background:var(--bad);border-color:var(--bad);color:#fff}.g.on.low small{color:#fff}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs img{width:88px;height:88px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.evidence-box{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}.evidence-title{font-size:13px;font-weight:700}.evidence-box .hint{margin:4px 0 10px}.evidence-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.evidence-input{display:none}.evidence-files{margin-top:10px}.evidence-files .thumbs img{width:72px;height:72px}.evidence-photo{display:grid;gap:3px;text-align:center}.evidence-photo small{font-size:10px;color:var(--mut);max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.thumb-preview{border:0;padding:0;background:transparent;position:relative;cursor:zoom-in}.thumb-preview img{display:block}.thumb-preview span{position:absolute;inset:auto 3px 3px;background:#101b28d9;color:white;border-radius:6px;font-size:9px;padding:2px}.photo-retry{border:1px solid var(--blue);border-radius:7px;background:var(--card);color:var(--blue);font-size:11px;padding:6px 4px;cursor:pointer}.review-notices{display:grid;gap:8px;margin-top:10px}.review-notice{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--warnbg);color:var(--warn);font-size:12px}.review-notice p{margin:4px 0}.review-notice small{display:block;font-size:11px}.photo-delete{border:0;background:transparent;color:var(--bad);font-size:10px;padding:2px 4px;cursor:pointer}.preview-sheet{position:fixed;inset:0;z-index:60;background:#050a10ed;display:flex;align-items:center;justify-content:center;padding:12px}.preview-box{width:min(100%,900px);height:min(95dvh,900px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}.preview-head{width:100%;display:flex;justify-content:space-between;align-items:center;color:#fff}.preview-image{max-width:100%;max-height:calc(95dvh - 70px);object-fit:contain;border-radius:8px}.evidence-files .fileb{cursor:default}.camera-sheet{position:fixed;inset:0;z-index:40;background:#08111df2;display:flex;align-items:center;justify-content:center;padding:12px}.camera-box{width:min(100%,560px);background:#101b28;color:#fff;border:1px solid #ffffff24;border-radius:18px;overflow:hidden;box-shadow:0 15px 45px #0008}.camera-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;font-weight:700}.camera-stage{background:#000;min-height:220px;display:grid;place-items:center}.camera-stage video{display:block;width:100%;max-height:60vh;object-fit:contain;background:#000}.camera-controls{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px}.camera-controls .btn{color:#fff;background:#ffffff1a;border-color:#ffffff40}.camera-controls .btn.p{background:var(--blue);border-color:var(--blue)}.camera-controls .btn:disabled{opacity:.4}.camera-shutter{width:62px;height:62px;border-radius:50%;background:#fff;border:5px solid #ffffff66;box-shadow:inset 0 0 0 3px #122131;flex:none}.camera-hint{font-size:12px;color:#d0dae5;padding:0 14px 12px;margin:0}@media(max-width:360px){.camera-controls{gap:5px;padding:10px}.camera-controls .btn{padding:8px 9px;font-size:11px}.camera-shutter{width:52px;height:52px}}.ai-progress{position:sticky;top:0;z-index:7;background:var(--warnbg);color:var(--warn);border-bottom:1px solid var(--line);padding:8px 14px;text-align:center;font-size:12px;font-weight:700}.analysis-box{margin-top:11px;padding:10px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:12px}.analysis-box strong{display:block;margin-bottom:4px}.analysis-row{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-top:1px solid var(--line)}.analysis-row .tx{flex:1;min-width:0}.analysis-row small{display:block;color:var(--mut);margin-top:2px}.ai-label{font-size:10px;font-weight:700;padding:3px 7px;border-radius:99px;white-space:nowrap;background:var(--warnbg);color:var(--warn)}.ai-label.good{background:var(--okbg);color:var(--ok)}.ai-label.bad{background:var(--badbg);color:var(--bad)}.subhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fileb{font-size:11px;border:1px solid var(--line);border-radius:10px;padding:8px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gap{color:var(--warn);font-size:12.5px;font-weight:600;margin:7px 0 0}.hb{background:var(--sky);border-radius:10px;padding:10px 12px;margin-top:11px;font-size:12.5px}.hb b{display:block;font-size:11.5px;margin-bottom:2px}
.hint{font-size:11px;color:var(--mut);margin:6px 0 0}
textarea.cm{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px;min-height:64px;outline:0;resize:vertical}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.foot div{max-width:520px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.arr{width:46px;height:46px;border-radius:50%;font-size:20px;color:var(--blue);display:grid;place-items:center}.arr:disabled{opacity:.25}
.cam{width:64px;height:64px;border-radius:50%;background:var(--blue);color:#fff;font-size:26px;display:grid;place-items:center;box-shadow:0 6px 16px #0a63c94d}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}.stats .card{margin:0}.stats strong{display:block;font-size:24px;letter-spacing:-.03em}.stats span{font-size:12px;color:var(--mut)}
.rowx{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}.rowx:first-child{border:0}.rowx .l{flex:1}.rowx small{display:block;color:var(--mut);font-size:11px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:10px 14px;font-weight:600;font-size:13px}.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}.btn.d{color:var(--bad)}
.act{display:grid;gap:7px;margin-top:10px}.act input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:9px;font-size:13px}

.note{font-size:11.5px;color:var(--mut);margin:12px 2px}

.sheet label{display:block;font-size:12px;color:var(--mut);margin:11px 0 4px}.sheet input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px}

button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#printdoc{display:none}
#report-tools{display:none}
body.report-open{background:#e9edf3}
body.report-open > :not(#printdoc):not(#report-tools):not(#toast){display:none!important}
body.report-open #report-tools:not([hidden]){display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:1200;padding:14px;background:#fff;border-bottom:1px solid #ccd5df}
#report-tools p{font-size:13px;margin:5px 0;color:#465566}
body.report-open #printdoc{display:block;max-width:210mm;box-sizing:border-box;padding:18px;margin:16px auto;background:white;color:#111;font:12px Arial,sans-serif;line-height:1.5}
#printdoc h1{font-size:22px;margin:0 0 6px}#printdoc h2{font-size:16px;margin:22px 0 8px;border-bottom:2px solid #222;break-after:avoid}#printdoc h3{font-size:13px;margin:14px 0 6px;break-after:avoid}#printdoc p{margin:4px 0}
#printdoc .pi{break-inside:avoid;border-top:1px solid #ccc;padding:7px 0}#printdoc .pr{display:inline-block;font-weight:bold;border:1px solid #222;min-width:22px;text-align:center;margin:0 6px}#printdoc .pc{margin-top:3px;color:#444}
#printdoc .report-media{display:inline-block;vertical-align:top;width:47%;margin:5px 1% 10px;break-inside:avoid}#printdoc .report-media img{display:block;max-width:100%;height:auto;max-height:90mm;object-fit:contain;border:1px solid #bbb}#printdoc figcaption{font-size:10px;line-height:1.4;margin-top:4px;overflow-wrap:anywhere}
@page{size:A4;margin:13mm}
@media print{body{background:white!important;margin:0!important}body > :not(#printdoc){display:none!important}#printdoc,body.report-open #printdoc{display:block!important;margin:0!important;padding:0!important;max-width:none!important;color:#000!important;background:#fff!important}body::before{display:none!important}}
@media screen and (max-width:600px){body.report-open #printdoc{margin:0;padding:14px}#report-tools .evidence-actions .btn{font-size:12px;padding:9px}#printdoc .report-media{width:100%;margin:8px 0}}
@media screen {
 #app{padding-bottom:calc(180px + env(safe-area-inset-bottom,0px))}
 .fab{bottom:calc(100px + env(safe-area-inset-bottom,0px))}
 .nav,.foot{bottom:80px}
 .sheet{padding-bottom:80px}
 .toast{bottom:calc(200px + env(safe-area-inset-bottom,0px))}
}
</style>

<script>
(()=>{
const PROFILE=window.SPBU_USER||null;
const seed=window.CHECKLIST_DATA||[],DB=PROFILE?"siap-audit-spbu-v16-"+PROFILE.username+"-"+(PROFILE.role==="admin"?"all":PROFILE.stationNumber||"belum"):"siap-audit-spbu-v2";
const factor={A:1,B:.8,C:.6,D:.4,E:.2,F:0};
const groups=[...new Set(seed.map(x=>x.subElement))],elements=[...new Set(seed.map(x=>x.element))];
const num=v=>Number(v)||0,esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Number(n||0).toLocaleString("id-ID",{minimumFractionDigits:1,maximumFractionDigits:2});
// Account sessions are checked by the server; discard the obsolete shared code.
try{localStorage.removeItem("siap-audit-akses")}catch{}
const maxOf=s=>{const m=String(s).match(/\((\d+(?:\.\d+)?)\)\s*$/);return m?Number(m[1]):0};
const elNo=s=>(String(s).match(/Elemen\s+(\d+)/i)||[])[1]||"";
let S={sessions:[]},ui={view:"jadwal",tab:"cek",sid:null,idx:0,open:{},sheet:false,activeReviews:[],analysisQueue:[],preview:null};
let sessionLeaving=false;
const $app=document.getElementById("app");
/* ---------- penyimpanan ---------- */
const dbOpen=()=>new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore("data");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function storedState(name){let fallback;try{fallback=JSON.parse(localStorage.getItem(name)||"null");if(fallback?.spbuLocalFallback===1&&Array.isArray(fallback.state?.sessions))return fallback.state}catch{}try{const db=await new Promise((res,rej)=>{const r=indexedDB.open(name,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains("data"))r.result.createObjectStore("data")};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});if(db.objectStoreNames.contains("data")){const v=await new Promise((res,rej)=>{const r=db.transaction("data").objectStore("data").get("state");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});if(v)return v}}catch(e){}return fallback?.spbuLocalFallback===1?fallback.state:fallback||null}
async function legacyLoad(){try{navigator.storage?.persist?.()}catch(e){}let changed=false;const v=await storedState(DB);if(v&&Array.isArray(v.sessions))S={...S,...v};if(!S.legacyMigrated){const old=await storedState("siap-audit-spbu-v1");S.legacyMigrated=true;changed=true;if(old&&old.items&&Object.keys(old.items).length&&!S.sessions.some(s=>s.id==="migrated-v1")){const items={};for(const [id,d] of Object.entries(old.items)){items[id]={...d,plan:old.actions?.[id]||d.plan||"",owner:old.owners?.[id]||d.owner||"",due:old.due?.[id]||d.due||""}}S.sessions.push({id:"migrated-v1",station:old.station||"SPBU",number:old.number||"",city:"",date:"",items});changed=true}}for(const s of S.sessions){s.items||={};s.evidence||={};s.aiEvidence||={};for(const x of seed){const d=s.items[x.id];if(d?.photos?.length){s.evidence[x.element]||=[];s.evidence[x.element].push(...d.photos.map(p=>({...p,sourceCode:x.code})));delete d.photos;delete s.aiEvidence[x.element];changed=true}}}changed=migratePhotoReviewState()||changed;if(changed||!v)save()}
async function load(){
 if(!PROFILE)return legacyLoad();
 try{await navigator.storage?.persist?.()}catch{}
 const saved=await storedState(DB);
 if(saved&&Array.isArray(saved.sessions))S={...saved,sessions:saved.sessions.filter(belongsToUser)};
 for(const session of S.sessions){session.items||={};session.evidence||={};session.aiEvidence||={};}
 const changed=migratePhotoReviewState();if(changed)for(const session of S.sessions)if(!session._remoteOnly&&Object.values(session.evidence||{}).flat().some(p=>p.aiReview?.status==='queued'))markAuditChanged(session);
 await persistState();startCloud().catch(afterCloudError);
}
let t,localEditVersion=0,savedEditVersion=-1;
const localWrites=new Set();
function persistState(){
 const write=(async()=>{let db,snapshotVersion;try{
  db=await dbOpen();await new Promise((res,rej)=>{
   const tx=db.transaction("data","readwrite");snapshotVersion=localEditVersion;tx.objectStore("data").put(S,"state");
   tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);
  });savedEditVersion=Math.max(savedEditVersion,snapshotVersion);
  if(snapshotVersion===localEditVersion)try{if(JSON.parse(localStorage.getItem(DB)||'null')?.spbuLocalFallback===1)localStorage.removeItem(DB)}catch{}
  return true;
 }catch(e){try{if(S.sessions.some(s=>Object.values(s.evidence||{}).flat().some(p=>p.mediaBlob)))throw e;snapshotVersion=localEditVersion;localStorage.setItem(DB,JSON.stringify({spbuLocalFallback:1,state:S}));savedEditVersion=Math.max(savedEditVersion,snapshotVersion);return true}
  catch(e2){toast("Penyimpanan penuh. Unduh cadangan lalu hapus sebagian foto.");return false}}
 finally{db?.close()}})();
 localWrites.add(write);write.then(()=>localWrites.delete(write),()=>localWrites.delete(write));return write;
}
async function flushLocalEdits(){
 if(savedEditVersion===localEditVersion)return true;
 if(localWrites.size)await Promise.all([...localWrites]);
 return savedEditVersion===localEditVersion?true:await persistState();
}
function save(session=sess()){if(!PROFILE)localEditVersion++;markAuditChanged(session);clearTimeout(t);t=setTimeout(()=>persistState(),150)}
function toast(m){const e=document.getElementById("toast");e.textContent=m;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2400)}
/* ---------- data & skor ---------- */
const sess=()=>S.sessions.find(s=>s.id===ui.sid);
const get=(s,id)=>s.items[id]||{rating:"",comment:""};
const evidence=(s,el)=>s.evidence?.[el]||[];
function itemPhotos(s,x){
 const reviews=s.aiEvidence?.[x.element]?.photoReviews||[];
 return evidence(s,x.element).map((photo,index)=>({photo,index})).filter(({photo})=>!photo.sourceCode||photo.sourceCode===x.code||reviews.some(r=>r.photoId===photo.id&&(r.results||[]).some(v=>v.code===x.code&&["terdukung","kurang_jelas"].includes(v.status))));
}
const aiFor=(s,x)=>s.aiEvidence?.[x.element]?.results?.find(r=>r.code===x.code)||null;
const mediaCount=list=>`${list.filter(p=>!isVideo(p)).length} foto • ${list.filter(isVideo).length} video`;
const aiStatusLabel=r=>({terdukung:"Terlihat",kurang_jelas:"Kurang jelas",tidak_terlihat:"Belum terlihat",tidak_dapat_dinilai_dari_foto:"Perlu cek manual"}[r]||"Belum dianalisis");
const aiStatusClass=r=>r==="terdukung"?"good":r==="tidak_terlihat"?"bad":"";
const done=s=>s._remoteOnly?(s._summary?.done||0):seed.filter(x=>get(s,x.id).rating).length;
const status=s=>{const d=done(s);return d===0?[0,"Belum dimulai"]:d<seed.length?[1,"Berlangsung"]:[2,"Selesai"]};
const issues=s=>seed.filter(x=>{const r=get(s,x.id).rating;return r&&r!=="A"&&r!=="X"});
function score(s){
 const rt=x=>get(s,x.id).rating;
 const units=[...new Set(seed.map(x=>x.subElement+"|"+(maxOf(x.section||"")?x.section:"")))].map(k=>{
  const [sub,sec]=k.split("|"),its=seed.filter(x=>x.subElement===sub&&(maxOf(x.section||"")?x.section:"")===sec),max=sec?maxOf(sec):maxOf(sub);
  const dn=its.filter(rt).length,ap=its.filter(x=>rt(x)&&rt(x)!=="X"),aw=ap.reduce((n,x)=>n+num(x.weight),0),raw=ap.reduce((n,x)=>n+num(x.weight)*(factor[rt(x)]??0),0);
  return{sub,sec,max,done:dn,total:its.length,score:dn===its.length&&aw>0?raw/aw*max:null,listed:its.reduce((n,x)=>n+num(x.weight),0)};
 });
 const det=groups.map(g=>{const u=units.filter(z=>z.sub===g),ok=u.every(z=>z.score!==null),base=maxOf(g);
  return{name:g,element:seed.find(x=>x.subElement===g).element,done:u.reduce((n,z)=>n+z.done,0),total:u.reduce((n,z)=>n+z.total,0),base,listed:u.reduce((n,z)=>n+z.listed,0),score:ok?u.reduce((n,z)=>n+z.score,0):null}});
 return{det,units,points:det.reduce((n,g)=>n+(g.score||0),0),scored:det.reduce((n,g)=>n+(g.score!==null?g.base:0),0)}
}
const hint=x=>{const t=x.text.toLowerCase();return /catatan|dokumen|sertifikat|ijin|izin|laporan|kartu|formulir|tanda terima|rekomendasi|surat|realisasi|penebusan/.test(t)?"Foto dokumen atau catatan terkait. Pastikan tanggal, nama, dan isinya terbaca.":/operator|petugas|seragam|pekerja|pengawas|\bstaf\b|pelanggan/.test(t)?"Foto petugas yang sedang bertugas, tampak dari depan, dengan bagian yang dinilai terlihat jelas.":/tersedia|tersedianya|menyediakan/.test(t)?"Foto barang, produk, atau fasilitas yang tersedia, dengan label atau merek terlihat.":"Foto area atau peralatan secara menyeluruh, lalu satu foto dekat pada bagian yang paling menentukan nilai."};
const evGaps=(s,x)=>{const d=get(s,x.id),r=d.rating,g=[];if(!r||r==="X")return g;const photos=itemPhotos(s,x),ai=aiFor(s,x);if(!photos.length)g.push("Belum ada foto yang terkait dengan butir ini");else if(!s.aiEvidence?.[x.element])g.push("Foto belum diperiksa AI");else if(ai&&ai.status!=="terdukung")g.push(aiStatusLabel(ai.status)+": "+(ai.reason||"perlu pemeriksaan"));else if(!ai)g.push("Hasil AI belum mencakup butir ini");if(r!=="A"&&!d.comment)g.push("Nilai di bawah A belum diberi catatan alasan");return g};
function chk(s){const is=issues(s),gl=seed.map((x,i)=>({x,i,g:evGaps(s,x)})).filter(z=>z.g.length),nr=seed.length-done(s),np=is.filter(x=>!get(s,x.id).plan).length,ok=!nr&&!gl.length&&!np;
 return `<h2>Pemeriksaan sebelum audit</h2><div class="card"><div class="rowx"><div class="l">Butir belum dinilai</div><span class="chip ${nr?"warn":"ok"}">${nr}</span></div><div class="rowx"><div class="l">Butir yang perlu meninjau bukti<small>Foto belum diperiksa AI, bukti belum terlihat, atau catatan temuan belum diisi</small></div><span class="chip ${gl.length?"warn":"ok"}">${gl.length}</span></div><div class="rowx"><div class="l">Temuan tanpa rencana perbaikan</div><span class="chip ${np?"warn":"ok"}">${np}</span></div>${ok?`<p class="hint">Semua butir sudah dinilai, bukti sudah diperiksa, dan temuan memiliki rencana.</p>`:""}${gl.slice(0,8).map(z=>`<button class="it" style="padding-left:0;padding-right:0" data-act="item" data-i="${z.i}"><div class="tx"><b>${esc(z.x.code)}</b>${esc(z.g.join(". "))}</div><span style="color:var(--warn)">⚠</span></button>`).join("")}${gl.length>8?`<p class="hint">Dan ${gl.length-8} butir lain.</p>`:""}</div>`}
const cls=r=>r==="A"?"ok":r==="B"||r==="C"?"warn":r&&r!=="X"?"bad":"";
const fdate=d=>d?new Intl.DateTimeFormat("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(new Date(d+"T00:00:00")):"-";
/* ---------- tampilan ---------- */
const offline=()=>`<span class="pill ${navigator.onLine?"on":"off"}">${navigator.onLine?"Online":"Offline"}</span>`;

function openNativeCamera(ei,sourceCode=""){

 const input=document.getElementById('native-camera');

 closeCamera();nativeCapture={sid:s.id,ei,sourceCode};input.value='';

async function nativePhotoJPEG(file){
 const type=String(file?.type||'').toLowerCase(),name=String(file?.name||'');
 if(!file||!file.size||file.size>40*1024*1024)throw new Error('Foto kosong atau terlalu besar. Ambil ulang dengan kamera HP.');
 if(!['image/jpeg','image/png','image/webp','image/heic','image/heif'].includes(type)&&!(type===''&&/\.(jpe?g|png|webp|heic|heif)$/i.test(name)))throw new Error('Berkas harus berupa foto. Ambil satu foto melalui kamera.');
 const url=URL.createObjectURL(file),image=new Image();let timer;
 try{
  await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=()=>reject(new Error('Foto belum dapat dibaca. Ambil ulang dengan kamera HP.'));timer=setTimeout(()=>reject(new Error('Foto terlalu lama diproses. Coba kamera HP.')),20000);image.src=url;});
  const width=image.naturalWidth||image.width,height=image.naturalHeight||image.height;
  if(!width||!height)throw new Error('Ukuran foto tidak terbaca. Ambil ulang.');
  const canvas=document.createElement('canvas'),scale=Math.min(1,1800/Math.max(width,height));
  canvas.width=Math.max(1,Math.round(width*scale));canvas.height=Math.max(1,Math.round(height*scale));
  const context=canvas.getContext('2d');if(!context)throw new Error('Pemrosesan foto tidak tersedia. Coba kamera HP.');
  context.drawImage(image,0,0,canvas.width,canvas.height);
  for(const quality of [.84,.72,.60]){const data=canvas.toDataURL('image/jpeg',quality);if(data.startsWith('data:image/jpeg;base64,')&&data.length<=3.5*1024*1024)return data;}
  throw new Error('Foto masih terlalu besar untuk diperiksa. Ambil ulang dengan kamera HP.');
 }finally{clearTimeout(timer);image.onload=null;image.onerror=null;URL.revokeObjectURL(url);}
}
function addCapturedPhoto(s,ei,data,navigate=true,sourceCode=""){
 const el=elements[ei];s.evidence||={};const photos=s.evidence[el]||=[],photoIndex=photos.length,queued=ui.activeReviews.length>0||ui.analysisQueue.length>0;
 const photo={id:'p'+(globalThis.crypto?.randomUUID?.()||Date.now()+Math.random().toString(36).slice(2)),name:'bukti-'+Date.now()+'.jpg',type:'image/jpeg',data,uploadedAt:new Date().toISOString(),...(sourceCode?{sourceCode}:{})};
 photos.push(photo);save(s);

 render(true);enqueuePhotoReview(s.id,ei,photoIndex);
 toast(queued?'Foto masuk antrean AI. Anda bisa lanjut memotret.':'Foto diterima. AI langsung memeriksanya.');return photo;
}
async function receiveNativePhoto(capture,file){
 try{
  const data=await nativePhotoJPEG(file),s=S.sessions.find(x=>x.id===capture.sid&&!x._cloud?.deleteRequested&&belongsToUser(x));
  if(!s)throw new Error('Audit tujuan sudah tidak tersedia. Buka audit lalu ambil foto kembali.');
  const photo=addCapturedPhoto(s,capture.ei,data,!sessionLeaving&&ui.sid===s.id&&ui.view!=='jadwal',capture.sourceCode);
  await persistState();return photo;
 }catch(error){toast(error.message||'Foto belum dapat disimpan. Ambil ulang.');return null;}
}

function waitMedia(video,event,action){
 return new Promise((resolve,reject)=>{
  const done=()=>{cleanup();resolve()},fail=()=>{cleanup();reject(new Error('Video belum dapat dibaca. Gunakan MP4/H.264 yang dapat diputar di HP.'))};
  const timer=setTimeout(()=>{cleanup();reject(new Error('Video terlalu lama diproses. Ambil video lebih singkat.'));},30000);
  function cleanup(){clearTimeout(timer);video.removeEventListener(event,done);video.removeEventListener('error',fail)}
  video.addEventListener(event,done,{once:true});video.addEventListener('error',fail,{once:true});try{action?.()}catch(error){cleanup();reject(error)}
 });
}
async function nativeVideoDetails(file){
 let type=String(file?.type||'').toLowerCase();
 if(!type){if(/\.mp4$/i.test(file?.name||''))type='video/mp4';else if(/\.mov$/i.test(file?.name||''))type='video/quicktime';else if(/\.webm$/i.test(file?.name||''))type='video/webm';}
 if(!['video/mp4','video/webm','video/quicktime'].includes(type))throw new Error('Gunakan video MP4, MOV, atau WebM.');
 if(!file?.size||file.size>MAX_VIDEO_BYTES)throw new Error('Video maksimal 12 MB. Ambil video lebih singkat atau gunakan resolusi 720p.');
 const video=document.createElement('video'),url=URL.createObjectURL(file);video.muted=true;video.playsInline=true;video.preload='auto';
 try{
  await waitMedia(video,'loadedmetadata',()=>{video.src=url;video.load()});
  if(!Number.isFinite(video.duration)||video.duration<=0||video.duration>60.5)throw new Error('Video maksimal 60 detik. Ambil ulang video lebih singkat.');
  if(!video.videoWidth||!video.videoHeight)throw new Error('Ukuran gambar video tidak terbaca.');
  const at=Math.min(.2,video.duration/2);
  await waitMedia(video,'seeked',()=>{video.currentTime=at});
  const canvas=document.createElement('canvas'),scale=Math.min(1,640/Math.max(video.videoWidth,video.videoHeight));canvas.width=Math.max(1,Math.round(video.videoWidth*scale));canvas.height=Math.max(1,Math.round(video.videoHeight*scale));
  canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);let posterData='';
  for(const quality of [.72,.55,.4]){posterData=canvas.toDataURL('image/jpeg',quality);if(posterData.length<=175000)break;}
  if(!posterData.startsWith('data:image/jpeg;base64,')||posterData.length>175000)throw new Error('Sampul video belum dapat dibuat. Ambil ulang video.');

}

async function cloudFetch(path,options={}){

  if(!res.ok){let value={};try{value=await res.json()}catch{}
   const error=new Error(value.error||"Server belum dapat dihubungi. Data di HP tetap disimpan.");
   Object.assign(error,{status:res.status,code:value.code||"CLOUD_UNAVAILABLE",retryAfter:Number(res.headers.get("retry-after"))||0});
   if(res.status===401){cloud.paused=true;cloud.error="Sesi berakhir. Masuk kembali dengan akun yang sama untuk mengirim perubahan.";updateCloudStatus();}
   throw error;
  }

 }catch(e){if(e.name==='AbortError')throw new Error('Pengiriman melewati waktu tunggu. Data di HP tetap disimpan dan akan dicoba lagi.');throw e}

  S.sessions.push(restored);

 await persistState();render(true);updateCloudStatus();scheduleCloud(0);toast(r.sessions.length+' audit dipulihkan dan masuk antrean sinkron.');

function dl(name,data,type="application/json"){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

const reportState={token:0,ready:false,busy:false,error:'',completed:0,total:0,snapshot:null,photos:false};
function reportStyles(){return `body{font:12px Arial,sans-serif;color:#111;margin:18px;background:#fff}h1{font-size:22px;margin:0 0 6px}h2{font-size:16px;margin:22px 0 8px;border-bottom:2px solid #222;break-after:avoid}h3{font-size:13px;margin:14px 0 6px;break-after:avoid}p{margin:4px 0;line-height:1.5}.pi{break-inside:avoid;border-top:1px solid #ccc;padding:7px 0}.pr{display:inline-block;font-weight:bold;border:1px solid #222;min-width:22px;text-align:center;margin:0 6px}.pc{margin-top:3px;color:#444}.report-media{display:inline-block;vertical-align:top;width:47%;margin:5px 1% 10px;break-inside:avoid}.report-media img{display:block;max-width:100%;height:auto;max-height:90mm;object-fit:contain;border:1px solid #bbb}.report-media figcaption{font-size:10px;line-height:1.4;margin-top:4px;overflow-wrap:anywhere}@page{size:A4;margin:13mm}@media print{body{margin:0}.report-toolbar{display:none!important}}`;}
function reportMarkup(s,photos,sources={}){
 const c=score(s),all=Object.values(s.evidence||{}).flat(),videos=all.filter(isVideo).length;
 let h=`<h1>Laporan pemeriksaan internal SPBU</h1><p><strong>${esc(s.station)}</strong> • No. SPBU ${esc(s.number)} • ${esc(s.city||'')}</p><p>Tanggal pemeriksaan: ${fdate(s.date)}</p><p>Poin subelemen selesai: ${fmt(c.points)} dari ${fmt(c.scored)} • Butir dinilai ${done(s)} / ${seed.length} • Nilai di bawah A: ${issues(s).length}</p><p>${all.length-videos} foto • ${videos} video${photos?' • Video ditampilkan sebagai cuplikan gambar; rekaman lengkap diputar di aplikasi.':''}</p><p>Simulasi internal, bukan nilai resmi auditor. AI meninjau bukti; nilai ditentukan pemeriksa.</p>`;
 for(const el of elements){
  h+=`<h2>${esc(el)}</h2>`;const list=evidence(s,el),ai=s.aiEvidence?.[el];
  if(photos){h+=list.length?list.map((p,i)=>`<figure class="report-media"><img src="${esc(sources[p.id]||'')}" alt="${isVideo(p)?'Cuplikan video':'Foto bukti'} ${i+1}"><figcaption><strong>${isVideo(p)?'Video':'Foto'} ${i+1}${isVideo(p)?' • '+mediaDuration(p.duration):''}</strong> • ${p.sourceCode?'Butir '+esc(p.sourceCode):'Bukti umum elemen'}<br>${esc(p.name||'Bukti')}${p.uploadedAt?' • '+esc(new Date(p.uploadedAt).toLocaleString('id-ID')):''}</figcaption></figure>`).join(''):'<p>Belum ada foto/video bukti untuk elemen ini.</p>';if(ai)h+=`<p>Pemeriksaan AI: ${esc(ai.summary||'')}</p>`;}
  let last='';for(const x of seed.filter(x=>x.element===el)){if(x.subElement!==last){h+=`<h3>${esc(x.subElement)}</h3>`;last=x.subElement;}const d=get(s,x.id),a=aiFor(s,x);h+=`<div class="pi"><strong>${esc(x.code)}</strong><span class="pr">${esc(d.rating||'-')}</span>${esc(x.text)}${a?`<div class="pc">AI: ${esc(aiStatusLabel(a.status))} — ${esc(a.reason||'')}</div>`:''}${d.comment?`<div class="pc">Catatan: ${esc(d.comment)}</div>`:''}${d.plan?`<div class="pc">Rencana perbaikan: ${esc(d.plan)}${d.owner?' • Penanggung jawab: '+esc(d.owner):''}${d.due?' • Target: '+esc(d.due):''}</div>`:''}</div>`;}
 }
 return h;
}
function updateReportTools(){
 const tools=document.getElementById('report-tools');if(!tools)return;tools.hidden=!ui.report;
 tools.innerHTML=`<div><strong>Pratinjau laporan</strong><p role="status">${reportState.error?esc(reportState.error):reportState.busy?`Menyiapkan bukti ${reportState.completed} / ${reportState.total}…`:'Laporan siap. Tekan Cetak / Simpan PDF.'}</p></div><div class="evidence-actions"><button type="button" class="btn p" data-act="report-print" ${reportState.ready?'':'disabled'}>Cetak / Simpan PDF</button><button type="button" class="btn" data-act="report-download" ${reportState.ready?'':'disabled'}>Unduh laporan HTML</button>${reportState.error?'<button type="button" class="btn" data-act="report-retry">Coba muat lagi</button>':''}<button type="button" class="btn" data-act="report-close">Kembali ke audit</button></div>`;
}
async function printableImage(blob){
 const image=new Image(),url=URL.createObjectURL(blob);let timer;
 try{
  await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=()=>reject(new Error('Salah satu gambar tidak dapat dibaca.'));timer=setTimeout(()=>reject(new Error('Waktu memuat gambar habis. Periksa internet lalu coba lagi.')),20000);image.src=url;});
  const width=image.naturalWidth||image.width,height=image.naturalHeight||image.height;if(!width||!height)throw new Error('Ukuran gambar laporan tidak terbaca.');
  const canvas=document.createElement('canvas'),scale=Math.min(1,1400/Math.max(width,height));canvas.width=Math.max(1,Math.round(width*scale));canvas.height=Math.max(1,Math.round(height*scale));canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/jpeg',.85);
 }finally{clearTimeout(timer);image.onload=null;image.onerror=null;URL.revokeObjectURL(url);}
}
async function reportPoster(p){
 if(p.posterData)return new Blob([photoBytes({data:p.posterData})],{type:'image/jpeg'});
 if(p.posterUrl)return(await cloudFetch(p.posterUrl,{headers:{accept:'image/jpeg'}})).blob();
 return new Blob([photoBytes({data:(await nativeVideoDetails(Object.assign(await mediaBlob(p),{name:p.name}))).posterData})],{type:'image/jpeg'});
}
async function waitReportImages(){
 const images=Array.from(document.getElementById('printdoc')?.querySelectorAll?.('img')||[]);
 await Promise.all(images.map(img=>new Promise((resolve,reject)=>{
  if(img.complete){if(img.naturalWidth)resolve();else reject(new Error('Ada gambar laporan yang gagal dimuat.'));return;}
  const timer=setTimeout(()=>{cleanup();reject(new Error('Gambar laporan belum selesai dimuat. Coba lagi.'));},20000);
  const loaded=()=>{cleanup();img.naturalWidth?resolve():reject(new Error('Ada gambar laporan yang gagal dimuat.'))},failed=()=>{cleanup();reject(new Error('Ada gambar laporan yang gagal dimuat.'))};
  function cleanup(){clearTimeout(timer);img.removeEventListener('load',loaded);img.removeEventListener('error',failed)}
  img.addEventListener('load',loaded,{once:true});img.addEventListener('error',failed,{once:true});
 })));
}
function resetReport(){
 reportState.token++;reportState.ready=false;reportState.busy=false;reportState.error='';reportState.snapshot=null;ui.report=null;document.body.classList.remove('report-open','pf');const doc=document.getElementById('printdoc');if(doc)doc.innerHTML='';updateReportTools();
}
function closeReport(){resetReport();render(true);}
async function prepareReport(s,photos){
 if(!s||!belongsToUser(s))return;const ticket=++reportState.token,snapshot=structuredClone(s);
 Object.assign(reportState,{ready:false,busy:true,error:'',completed:0,total:photos?Object.values(snapshot.evidence||{}).flat().length:0,snapshot,photos});ui.report={photos:!!photos};ui.preview=null;closeCamera();document.body.classList.add('report-open');document.getElementById('printdoc').innerHTML='<p>Menyiapkan laporan…</p>';updateReportTools();recordNavigation();window.scrollTo(0,0);
 try{
  const sources={},list=photos?Object.values(snapshot.evidence||{}).flat():[];let index=0;
  const results=await Promise.allSettled(Array.from({length:Math.min(3,list.length)},async()=>{for(;;){const at=index++;if(at>=list.length||ticket!==reportState.token)return;const p=list[at],blob=isVideo(p)?await reportPoster(p):await mediaBlob(p);sources[p.id]=await printableImage(blob);if(ticket!==reportState.token)return;reportState.completed++;updateReportTools();}}));
  if(ticket!==reportState.token)return;const failed=results.find(x=>x.status==='rejected');if(failed)throw failed.reason;
  document.getElementById('printdoc').innerHTML=reportMarkup(snapshot,photos,sources);await waitReportImages();if(ticket!==reportState.token)return;reportState.ready=true;reportState.busy=false;updateReportTools();
 }catch(error){if(ticket!==reportState.token)return;reportState.busy=false;reportState.error='Laporan belum siap: '+(error.message||'bukti belum dapat dimuat')+' Tekan Coba muat lagi.';updateReportTools();}
}
function printReadyReport(){
 if(!reportState.ready||!ui.report){toast('Tunggu seluruh gambar laporan selesai dimuat.');return;}
 try{document.body.classList.add('pf');window.print();}catch{document.body.classList.remove('pf');reportState.error='Dialog cetak tidak tersedia di browser ini. Unduh laporan HTML, lalu buka di Chrome atau Safari dan gunakan menu Cetak.';updateReportTools();}
}
function downloadReportHTML(){
 if(!reportState.ready||!ui.report)return;
 const body=document.getElementById('printdoc').innerHTML,title='Laporan SPBU '+reportState.snapshot.number;
 const content='<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(title)+'</title><style>'+reportStyles()+'</style><body><div class="report-toolbar"><button type="button" onclick="window.print()">Cetak / Simpan PDF</button><p>Jika dialog tidak muncul, gunakan menu Cetak pada browser.</p></div>'+body+'</body></html>';
 dl('laporan-spbu-'+stationID(reportState.snapshot.number)+'.html',content,'text/html;charset=utf-8');
}
window.addEventListener('afterprint',()=>document.body.classList.remove('pf'));
/*report:end*/

document.addEventListener("click",async e=>{
 const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,s=sess();
 if(a==="cloud-retry"){if(cloud.paused){location.href='/auth/login';return}cloud.error='';await syncCloud();}
 else if(a==="cloud-refresh"){await refreshCatalog();}
 else if(a==="cloud-import"){await importLegacyAudits();}
 else if(a==="cloud-copy"){await copyConflictingAudit(S.sessions.find(x=>x.id===b.dataset.sid));}
 else if(a==="cloud-pull"){await pullServerVersion(S.sessions.find(x=>x.id===b.dataset.sid));}
 else if(a==="cloud-history"){await showCloudHistory(s);}

 else if(a==="cloud-restore"){await restoreCloudVersion(b.dataset);}
 else if(a==="cloud-close"){cloud.dialog=null;render(true);}
 else if(a==="edit-audit"){ui.editSid=s.id;ui.sheet=true;render(true);}

 else if(a==="cancel"){ui.sheet=false;ui.editSid=null;render(true)}
 else if(a==="back-j"){ui.view="jadwal";ui.sid=null;render()}
 else if(a==="back-s"){ui.view="sess";ui.tab="cek";render(true)}
 else if(a==="tab"){ui.tab=b.dataset.tab;render()}
 else if(a==="tog"){ui.open[b.dataset.k]=!ui.open[b.dataset.k];render(true)}

 else if(a==="prev"||a==="next"){moveItem(a==="next"?1:-1)}

else if(a==="preview-evidence"){const ei=Number(b.dataset.el),el=elements[ei],p=evidence(s,el).find(p=>p.id===b.dataset.id)||evidence(s,el)[Number(b.dataset.i)];if(p){ui.preview={sid:s.id,ei,photoId:p.id,photoIndex:Number(b.dataset.i)};render(true)}}
 else if(a==="close-preview"&&e.target===b){ui.preview=null;render(true)}
 else if(a==="retry-evidence"){const ei=Number(b.dataset.el),i=evidence(s,elements[ei]).findIndex(p=>p.id===b.dataset.id);if(i>=0){enqueuePhotoReview(s.id,ei,i,true);toast(navigator.onLine?"Foto tersimpan dijadwalkan untuk diperiksa lagi.":"Foto tetap tersimpan; pemeriksaan dilanjutkan saat online.")}}
 else if(a==="rm-evidence"){if(!confirm("Hapus foto/video bukti ini?"))return;const el=elements[Number(b.dataset.el)],photos=evidence(s,el),i=b.dataset.id?photos.findIndex(p=>p.id===b.dataset.id):Number(b.dataset.i);if(i>=0){removeEvidencePhoto(s,el,i);save();pumpPhotoReviews()}}
 else if(a==="back-evidence"){ui.view="sess";ui.tab="cek";ui.open[elements.indexOf(seed[ui.idx].element)]=true;render(true)}
 else if(a==="fixed"){setItem(s,b.dataset.id,d=>{d.actionDone=!d.actionDone});render(true)}
 else if(a==="backup"){await downloadBackup([s],"cadangan-"+(s.number||"audit")+".json")}else if(a==="backup-all"){if(PROFILE)await refreshCatalog();await downloadBackup(S.sessions.filter(x=>!x._cloud?.deleteRequested),"cadangan-semua-audit.json")}else if(a==="export"){try{await hydratePhotos(s)}catch(e){toast(e.message);return}dl("siap-audit-"+s.number+".json",JSON.stringify({namaSPBU:s.station,nomorSPBU:s.number,kota:s.city,tanggal:s.date,buktiPerElemen:s.evidence,hasilPemeriksaanAI:s.aiEvidence,checklist:seed.map(x=>({kode:x.code,butir:x.text,subElemen:x.subElement,elemen:x.element,bobot:x.weight,hasilAI:aiFor(s,x),...get(s,x.id)}))},null,2))}
 else if(a==="print-plain"||a==="print-full"){await prepareReport(s,a==="print-full")}
 else if(a==="report-print"){printReadyReport()}
 else if(a==="report-download"){downloadReportHTML()}
 else if(a==="report-close"){closeReport()}
 else if(a==="report-retry"){await prepareReport(sess(),reportState.photos)}
 else if(a==="del"){deleteCloudAudit(s)}
});
