<title>Siap Audit SPBU</title>
<style>
:root{--bg:#f1f5fa;--card:#fff;--ink:#14222f;--mut:#667789;--line:#e1e8f0;--blue:#0a63c9;--deep:#064489;--sky:#e6f1fd;--ok:#2e8b57;--okbg:#e7f6ee;--warn:#b7791f;--warnbg:#fff3dc;--bad:#c4423a;--badbg:#fdeceb;--lime:#9bbf1f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}

:root[data-theme="dark"]{--bg:#0d1620;--card:#16212e;--ink:#e7eef6;--mut:#8fa1b4;--line:#243345;--blue:#3b8cf0;--deep:#0b2f5e;--sky:#13304f;--okbg:#12311f;--warnbg:#3a2c10;--badbg:#3b1b19;--ok:#4cc17f;--warn:#e2b04f;--bad:#f0817a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--deep);z-index:10}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:96px}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(160deg,var(--blue),var(--deep));color:#fff;padding:14px 16px}
.hd .row{display:flex;align-items:center;gap:10px}
.hd h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0}
.hd small{display:block;font-size:12px;opacity:.82;font-weight:400}
.ib{width:36px;height:36px;border-radius:50%;background:#ffffff26;color:#fff;font-size:18px;display:grid;place-items:center;flex:none}
.pill{font-size:11px;padding:3px 9px;border-radius:99px;background:#ffffff26;white-space:nowrap}
.pill.off::before{content:"● ";color:#ff8b82}.pill.on::before{content:"● ";color:#9be7b5}
.bar{height:5px;border-radius:9px;background:#ffffff33;margin-top:11px;overflow:hidden}.bar i{display:block;height:100%;background:#fff;border-radius:9px}
.pad{padding:14px 16px}
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 13px;outline:0}
.search:focus{border-color:var(--blue)}
h2{font-size:16px;margin:18px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:11px}
.sp{width:100%;text-align:left;display:block}
.sp b{font-size:14px}.sp .meta{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin-top:9px;font-size:13px;color:var(--mut)}.sp .meta span:nth-child(even){color:var(--ink);font-weight:600}
.st{display:inline-block;font-size:12px;font-weight:700}.st.s0{color:var(--bad)}.st.s1{color:var(--lime)}.st.s2{color:var(--ok)}
.mini{height:4px;border-radius:9px;background:var(--line);margin-top:11px;overflow:hidden}.mini i{display:block;height:100%;background:var(--blue)}
.fab{position:fixed;right:max(16px,calc((100vw - 520px)/2 + 16px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--blue);color:#fff;border-radius:99px;padding:13px 20px;font-weight:700;box-shadow:0 8px 22px #0a63c94d;z-index:6}
.el{width:100%;display:flex;align-items:center;gap:11px;text-align:left;padding:13px 14px}
.el .t{flex:1;font-weight:700;font-size:13.5px}.el .t small{display:block;color:var(--mut);font-weight:500;font-size:12px}
.ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;border:2px solid var(--line);color:var(--mut)}
.ic.ok{background:var(--ok);border-color:var(--ok);color:#fff}.ic.bad{background:none;border:0;color:var(--bad);font-size:18px}.ic.warn{background:none;border:0;color:var(--warn);font-size:18px}
.sub{font-size:12px;font-weight:700;color:var(--blue);margin:12px 14px 4px}
.it{width:100%;display:flex;gap:11px;align-items:flex-start;text-align:left;padding:11px 14px;border-top:1px solid var(--line)}
.it .tx{flex:1;font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.it .tx b{display:block;font-size:11px;color:var(--mut)}
.chip{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--sky);color:var(--mut);white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav div{max-width:520px;margin:0 auto;display:flex}.nav button{flex:1;padding:9px 4px 8px;font-size:11px;color:var(--mut);display:grid;gap:1px;justify-items:center}.nav button span{font-size:19px}.nav button.on{color:var(--blue);font-weight:700}
.crit{font-size:15.5px;line-height:1.5;margin:0}.crit-meta{font-size:12px;color:var(--mut);margin:0 0 10px}
.grades{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:6px 0}
.g{width:62px;height:62px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:17px;display:grid;place-items:center;align-content:center;line-height:1.1}
.g small{font-size:10px;font-weight:500;color:var(--mut)}
.g.on{background:var(--lime);border-color:var(--lime);color:#14222f}.g.on small{color:#14222f}.g.on.x{background:var(--mut);border-color:var(--mut);color:#fff}.g.on.low{background:var(--bad);border-color:var(--bad);color:#fff}.g.on.low small{color:#fff}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs img{width:88px;height:88px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.evidence-box{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}.evidence-title{font-size:13px;font-weight:700}.evidence-box .hint{margin:4px 0 10px}.evidence-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.evidence-input{display:none}.evidence-files{margin-top:10px}.evidence-files .thumbs img{width:72px;height:72px}.evidence-photo{display:grid;gap:3px;text-align:center}.evidence-photo small{font-size:10px;color:var(--mut);max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.thumb-preview{border:0;padding:0;background:transparent;position:relative;cursor:zoom-in}.thumb-preview img{display:block}.thumb-preview span{position:absolute;inset:auto 3px 3px;background:#101b28d9;color:white;border-radius:6px;font-size:9px;padding:2px}.photo-retry{border:1px solid var(--blue);border-radius:7px;background:var(--card);color:var(--blue);font-size:11px;padding:6px 4px;cursor:pointer}.review-notices{display:grid;gap:8px;margin-top:10px}.review-notice{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--warnbg);color:var(--warn);font-size:12px}.review-notice p{margin:4px 0}.review-notice small{display:block;font-size:11px}.photo-delete{border:0;background:transparent;color:var(--bad);font-size:10px;padding:2px 4px;cursor:pointer}.preview-sheet{position:fixed;inset:0;z-index:60;background:#050a10ed;display:flex;align-items:center;justify-content:center;padding:12px}.preview-box{width:min(100%,900px);height:min(95dvh,900px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}.preview-head{width:100%;display:flex;justify-content:space-between;align-items:center;color:#fff}.preview-image{max-width:100%;max-height:calc(95dvh - 70px);object-fit:contain;border-radius:8px}.evidence-files .fileb{cursor:default}.camera-sheet{position:fixed;inset:0;z-index:40;background:#08111df2;display:flex;align-items:center;justify-content:center;padding:12px}.camera-box{width:min(100%,560px);background:#101b28;color:#fff;border:1px solid #ffffff24;border-radius:18px;overflow:hidden;box-shadow:0 15px 45px #0008}.camera-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;font-weight:700}.camera-stage{background:#000;min-height:220px;display:grid;place-items:center}.camera-stage video{display:block;width:100%;max-height:60vh;object-fit:contain;background:#000}.camera-controls{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px}.camera-controls .btn{color:#fff;background:#ffffff1a;border-color:#ffffff40}.camera-controls .btn.p{background:var(--blue);border-color:var(--blue)}.camera-controls .btn:disabled{opacity:.4}.camera-shutter{width:62px;height:62px;border-radius:50%;background:#fff;border:5px solid #ffffff66;box-shadow:inset 0 0 0 3px #122131;flex:none}.camera-hint{font-size:12px;color:#d0dae5;padding:0 14px 12px;margin:0}@media(max-width:360px){.camera-controls{gap:5px;padding:10px}.camera-controls .btn{padding:8px 9px;font-size:11px}.camera-shutter{width:52px;height:52px}}.ai-progress{position:sticky;top:0;z-index:7;background:var(--warnbg);color:var(--warn);border-bottom:1px solid var(--line);padding:8px 14px;text-align:center;font-size:12px;font-weight:700}.analysis-box{margin-top:11px;padding:10px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:12px}.analysis-box strong{display:block;margin-bottom:4px}.analysis-row{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-top:1px solid var(--line)}.analysis-row .tx{flex:1;min-width:0}.analysis-row small{display:block;color:var(--mut);margin-top:2px}.ai-label{font-size:10px;font-weight:700;padding:3px 7px;border-radius:99px;white-space:nowrap;background:var(--warnbg);color:var(--warn)}.ai-label.good{background:var(--okbg);color:var(--ok)}.ai-label.bad{background:var(--badbg);color:var(--bad)}.subhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fileb{font-size:11px;border:1px solid var(--line);border-radius:10px;padding:8px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gap{color:var(--warn);font-size:12.5px;font-weight:600;margin:7px 0 0}.hb{background:var(--sky);border-radius:10px;padding:10px 12px;margin-top:11px;font-size:12.5px}.hb b{display:block;font-size:11.5px;margin-bottom:2px}
.hint{font-size:11px;color:var(--mut);margin:6px 0 0}
textarea.cm{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px;min-height:64px;outline:0;resize:vertical}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.foot div{max-width:520px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.arr{width:46px;height:46px;border-radius:50%;font-size:20px;color:var(--blue);display:grid;place-items:center}.arr:disabled{opacity:.25}
.cam{width:64px;height:64px;border-radius:50%;background:var(--blue);color:#fff;font-size:26px;display:grid;place-items:center;box-shadow:0 6px 16px #0a63c94d}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}.stats .card{margin:0}.stats strong{display:block;font-size:24px;letter-spacing:-.03em}.stats span{font-size:12px;color:var(--mut)}
.rowx{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}.rowx:first-child{border:0}.rowx .l{flex:1}.rowx small{display:block;color:var(--mut);font-size:11px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:10px 14px;font-weight:600;font-size:13px}.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}.btn.d{color:var(--bad)}
.act{display:grid;gap:7px;margin-top:10px}.act input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:9px;font-size:13px}
.empty{text-align:center;color:var(--mut);padding:34px 16px;font-size:13px}
.note{font-size:11.5px;color:var(--mut);margin:12px 2px}
.sheet{position:fixed;inset:0;z-index:20;background:#06182c99;display:flex;align-items:flex-end;justify-content:center}.sheet form,.sheet .box{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet label{display:block;font-size:12px;color:var(--mut);margin:11px 0 4px}.sheet input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#14222f;color:#fff;border-radius:10px;padding:9px 14px;font-size:12px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#printdoc{display:none}
@media print{body.pf{background:#fff}body.pf #app,body.pf .toast{display:none!important}body.pf #printdoc{display:block;color:#000;background:#fff;font-size:11px;line-height:1.4}#printdoc h1{font-size:18px;margin:0 0 4px}#printdoc h2{font-size:14px;margin:16px 0 4px;border-bottom:2px solid #000;break-after:avoid}#printdoc h3{font-size:12px;margin:10px 0 2px;break-after:avoid}#printdoc p{margin:2px 0}.pi{break-inside:avoid;border-top:1px solid #bbb;padding:5px 0}.pr{display:inline-block;min-width:22px;text-align:center;font-weight:700;border:1px solid #000;margin:0 6px 0 4px}.pc{margin-top:2px;font-style:italic}.pp img{width:150px;height:110px;object-fit:cover;margin:4px 4px 0 0;border:1px solid #999}}
@media print{body::before,.hd,.nav,.fab,.foot,.btn{display:none!important}#app{max-width:none;padding:0}.card{break-inside:avoid}}
</style>

function mergePhotoResults(previous,review,criteria){const oldReviews=(previous?.photoReviews||[]).filter(r=>!review?.photoId||r.photoId!==review.photoId);if(!oldReviews.length&&previous?.results?.length&&!previous?.photoReviews)oldReviews.push({photoIndex:0,summary:previous.summary||"",results:previous.results});if(review)oldReviews.push(review);const rank={terdukung:4,kurang_jelas:3,tidak_terlihat:2,tidak_dapat_dinilai_dari_foto:1};const results=oldReviews.length?criteria.map(x=>{const hits=oldReviews.flatMap(q=>(q.results||[]).filter(r=>r.code===x.code).map(r=>({...r,photoIndex:q.photoIndex})));if(!hits.length)return{code:x.code,status:"tidak_dapat_dinilai_dari_foto",reason:"Belum ada hasil pemeriksaan untuk butir ini.",photoNumbers:[]};const best=Math.max(...hits.map(r=>rank[r.status]||0)),chosen=hits.filter(r=>(rank[r.status]||0)===best),nums=[...new Set(chosen.map(r=>r.photoIndex).filter(n=>n>0))].sort((a,b)=>a-b);return{code:x.code,status:chosen[0].status,reason:[...new Set(chosen.map(r=>r.reason).filter(Boolean))].slice(0,2).join("; "),photoNumbers:nums}}):[];return{photoReviews:oldReviews,results}}

const makeBackup=list=>JSON.stringify({format:BACKUP_FORMAT,versi:1,dibuat:new Date().toISOString(),sessions:list});
function parseBackup(text,existing){const j=JSON.parse(text);if(!j||j.format!==BACKUP_FORMAT)throw new Error("format");const ids=new Set(existing),out=[];let copies=0;
 for(const s of Array.isArray(j.sessions)?j.sessions:[]){if(!s||typeof s!=="object"||(typeof s.number!=="string"&&typeof s.station!=="string"))continue;
  const obj=v=>v&&typeof v==="object"&&!Array.isArray(v)?v:{};const n={...s,items:obj(s.items),evidence:{},aiEvidence:obj(s.aiEvidence)};
  for(const [el,list] of Object.entries(obj(s.evidence)))n.evidence[el]=(Array.isArray(list)?list:[]).filter(p=>p&&typeof p.data==="string"&&p.data.startsWith("data:image/"));
  n.id=String(n.id||"s"+Date.now()+out.length);if(ids.has(n.id)){n.id=n.id+"-p"+Date.now().toString(36)+out.length;n.station=(n.station||"")+" (pulihan)";copies++}ids.add(n.id);out.push(n)}
 return{sessions:out,copies}}
/*backup:end*/
async function restoreFile(file){try{const r=parseBackup(await file.text(),S.sessions.map(x=>x.id));if(!r.sessions.length){toast("Berkas tidak berisi audit.");return}S.sessions.push(...r.sessions);try{migratePhotoReviewState()}catch(e){}save();render(true);toast(r.sessions.length+" audit dipulihkan"+(r.copies?" ("+r.copies+" sebagai salinan karena sudah ada)":""))}catch(e){toast("Berkas cadangan tidak valid.")}}
document.addEventListener("change",e=>{const t=e.target;if(t&&t.matches&&t.matches("[data-restore]")&&t.files&&t.files[0]){restoreFile(t.files[0]);t.value=""}});
function dl(name,data){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function printDoc(s,photos){const c=score(s);let h=`<h1>Laporan pemeriksaan internal</h1><p>${esc(s.station)} • No. SPBU ${esc(s.number)} • ${esc(s.city||"")} • ${fdate(s.date)}</p><p>Poin subelemen selesai: ${fmt(c.points)} dari ${fmt(c.scored)} • Butir dinilai ${done(s)} / ${seed.length} • Nilai di bawah A: ${issues(s).length}</p><p>Simulasi internal, bukan nilai resmi auditor. Status AI hanya peninjauan bukti visual; nilai tetap ditentukan pemeriksa.</p>`;
 elements.forEach(el=>{h+=`<h2>${esc(el)}</h2>`;const ph=evidence(s,el),ai=s.aiEvidence?.[el];if(photos){h+=`<div class="pi"><b>Bukti foto elemen</b>${ph.length?`<div class="pp">${ph.map(q=>q.type&&q.type.startsWith("image/")?`<img src="${q.data}" alt="Bukti">`:`<i>${esc(q.name||"dokumen")} (PDF)</i>`).join("")}</div>`:`<p>Tidak ada foto bukti.</p>`}${ai?`<p>Pemeriksaan AI: ${esc(ai.summary||"")}</p>`:"<p>AI belum memeriksa bukti.</p>"}</div>`}let last="";seed.filter(x=>x.element===el).forEach(x=>{if(x.subElement!==last){h+=`<h3>${esc(x.subElement)}</h3>`;last=x.subElement}const d=get(s,x.id),a=aiFor(s,x);h+=`<div class="pi"><b>${esc(x.code)}</b><span class="pr">${d.rating||"-"}</span>${esc(x.text)}${a?`<div class="pc">Pemeriksaan bukti AI: ${esc(aiStatusLabel(a.status))} — ${esc(a.reason||"")}</div>`:""}${d.comment?`<div class="pc">Catatan: ${esc(d.comment)}</div>`:""}</div>`})});
 document.getElementById("printdoc").innerHTML=h;document.body.classList.add("pf");try{window.print()}catch(e){toast("Cetak tidak tersedia di sini. Buka halaman ini langsung di browser.");document.body.classList.remove("pf")}}
window.addEventListener("afterprint",()=>document.body.classList.remove("pf"));
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,s=sess();
 if(a==="open-camera"){openCamera(Number(b.dataset.el))}
 else if(a==="cancel-camera"){closeCamera();render(true)}
 else if(a==="camera-shot"){takeCameraPhoto()}
 else if(a==="open"){ui.sid=b.dataset.sid;ui.view="sess";ui.tab="cek";render()}
 else if(a==="new"){ui.sheet=true;render(true)}
 else if(a==="cancel"){ui.sheet=false;render(true)}
 else if(a==="back-j"){ui.view="jadwal";ui.sid=null;render()}
 else if(a==="back-s"){ui.view="sess";ui.tab="cek";render(true)}
 else if(a==="tab"){ui.tab=b.dataset.tab;render()}
 else if(a==="tog"){ui.open[b.dataset.k]=!ui.open[b.dataset.k];render(true)}
 else if(a==="item"){ui.idx=Number(b.dataset.i);ui.view="item";render()}
 else if(a==="prev"||a==="next"){moveItem(a==="next"?1:-1)}
 else if(a==="rate"){setItem(s,seed[ui.idx].id,d=>{d.rating=d.rating===b.dataset.r?"":b.dataset.r});render(true)}
else if(a==="preview-evidence"){const ei=Number(b.dataset.el),el=elements[ei],p=evidence(s,el).find(p=>p.id===b.dataset.id)||evidence(s,el)[Number(b.dataset.i)];if(p){ui.preview={sid:s.id,ei,photoId:p.id,photoIndex:Number(b.dataset.i)};render(true)}}
 else if(a==="close-preview"&&e.target===b){ui.preview=null;render(true)}
 else if(a==="retry-evidence"){const ei=Number(b.dataset.el),i=evidence(s,elements[ei]).findIndex(p=>p.id===b.dataset.id);if(i>=0){enqueuePhotoReview(s.id,ei,i,true);toast(navigator.onLine?"Foto tersimpan dijadwalkan untuk diperiksa lagi.":"Foto tetap tersimpan; pemeriksaan dilanjutkan saat online.")}}
 else if(a==="rm-evidence"){if(!confirm("Hapus foto bukti ini?"))return;const el=elements[Number(b.dataset.el)],photos=evidence(s,el),i=b.dataset.id?photos.findIndex(p=>p.id===b.dataset.id):Number(b.dataset.i);if(i>=0){removeEvidencePhoto(s,el,i);save();pumpPhotoReviews()}}
 else if(a==="back-evidence"){ui.view="sess";ui.tab="cek";ui.open[elements.indexOf(seed[ui.idx].element)]=true;render(true)}
 else if(a==="fixed"){setItem(s,b.dataset.id,d=>{d.actionDone=!d.actionDone});render(true)}
 else if(a==="backup"){dl("cadangan-"+(s.number||"audit")+".json",makeBackup([s]));toast("Cadangan diunduh. Simpan di tempat aman.")}else if(a==="backup-all"){dl("cadangan-semua-audit.json",makeBackup(S.sessions));toast("Cadangan diunduh. Simpan di tempat aman.")}else if(a==="export"){dl("siap-audit-"+s.number+".json",JSON.stringify({namaSPBU:s.station,nomorSPBU:s.number,kota:s.city,tanggal:s.date,buktiPerElemen:s.evidence,hasilPemeriksaanAI:s.aiEvidence,checklist:seed.map(x=>({kode:x.code,butir:x.text,subElemen:x.subElement,elemen:x.element,bobot:x.weight,hasilAI:aiFor(s,x),...get(s,x.id)}))},null,2))}
 else if(a==="print-plain"||a==="print-full"){printDoc(s,a==="print-full")}
 else if(a==="del"){if(confirm("Hapus audit ini beserta semua nilai dan fotonya dari perangkat?")){S.sessions=S.sessions.filter(z=>z.id!==s.id);save();ui.view="jadwal";ui.sid=null;render()}}
});
document.addEventListener("submit",e=>{const f=e.target.closest("[data-form]");if(!f)return;e.preventDefault();const v=Object.fromEntries(new FormData(f));const s={id:"s"+Date.now(),station:v.station.trim(),number:v.number.trim(),city:v.city.trim(),date:v.date,items:{},evidence:{},aiEvidence:{}};S.sessions.push(s);save();ui.sheet=false;ui.sid=s.id;ui.view="sess";ui.tab="cek";render()});
document.addEventListener("change",async e=>{
 const s=sess(),t=e.target;if(!s)return;
 if(t.matches("[data-comment]"))setItem(s,seed[ui.idx].id,d=>{d.comment=t.value});
 else if(t.matches("[data-f]"))setItem(s,t.dataset.id,d=>{d[t.dataset.f]=t.value});
 
});
document.addEventListener("input",e=>{const t=e.target;if(!t.matches("[data-q]"))return;const q=t.value.trim().toLowerCase();
 if(ui.view==="jadwal"){document.querySelectorAll("[data-hay]").forEach(n=>n.hidden=!!q&&!n.dataset.hay.includes(q));return}
 document.querySelectorAll(".ecard").forEach(c=>{const bd=c.querySelector(".ebody");let any=false;c.querySelectorAll(".it").forEach(n=>{const m=!q||n.dataset.hay.includes(q);n.hidden=!m;if(m)any=true});bd.hidden=q?!any:!c.dataset.open;c.hidden=!!q&&!any})});
function moveItem(dir){const next=Math.max(0,Math.min(seed.length-1,ui.idx+dir));if(next===ui.idx)return;ui.idx=next;render()}
let swipeStart=null;$app.addEventListener("touchstart",e=>{if(ui.view!=="item")return;const t=e.changedTouches[0];swipeStart={x:t.clientX,y:t.clientY}},{passive:true});$app.addEventListener("touchend",e=>{if(!swipeStart||ui.view!=="item")return;const t=e.changedTouches[0],dx=t.clientX-swipeStart.x,dy=t.clientY-swipeStart.y;swipeStart=null;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.25)moveItem(dx<0?1:-1)},{passive:true});
window.addEventListener("online",()=>pumpPhotoReviews());window.addEventListener("offline",()=>render(true));
load().then(()=>{render();pumpPhotoReviews()});
})();
</script>
<script>if("serviceWorker"in navigator&&location.protocol.startsWith("http")){navigator.serviceWorker.register("sw.js").catch(function(){})}</script>
